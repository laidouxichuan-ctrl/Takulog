name: Takulog Release Check

on:
  push:
    branches:
      - main
    paths:
      - "index.html"

  workflow_dispatch:

jobs:
  release-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release information
        id: release
        shell: python
        run: |
          import re
          import os

          with open("index.html", "r", encoding="utf-8") as f:
              html = f.read()

          version_match = re.search(
              r'<div class="brand-version">\s*(Ver\.\d+\.\d+\.\d+)\s*</div>',
              html
          )

          release_match = re.search(
              r'<!--\s*TAKULOG_RELEASE_INFO_START\s*-->\s*(.*?)\s*<!--\s*TAKULOG_RELEASE_INFO_END\s*-->',
              html,
              re.S
          )

          if not version_match:
              raise Exception("バージョン情報が見つかりません")

          if not release_match:
              raise Exception("リリース情報が見つかりません")

          version = version_match.group(1).strip()
          release = release_match.group(1).strip()

          # 空のカテゴリを除去
          lines = release.splitlines()
          result = []

          categories = {
              "新機能",
              "変更・改善",
              "不具合の修正"
          }

          i = 0

          while i < len(lines):
              line = lines[i].strip()

              if line in categories:
                  category = line
                  items = []

                  i += 1

                  while i < len(lines):
                      item = lines[i].strip()

                      if item in categories:
                          break

                      if item.startswith("・") and item != "・":
                          items.append(item)

                      i += 1

                  if items:
                      result.append(category)
                      result.extend(items)

                  continue

              i += 1

          release_text = "\n".join(result)

          # Discord通知本文を作成
          message = (
              f"卓ログ バージョン更新{version}\n"
              f"内容は下記となります。\n\n"
              f"{release_text}"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"version={version}\n")
              f.write("message<<MESSAGE\n")
              f.write(message)
              f.write("\nMESSAGE\n")

          print("================================")
          print("卓ログ リリース情報")
          print("================================")
          print(message)
          print("================================")

      - name: Check Supabase
        id: check
        shell: python
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          import os
          import urllib.request
          import urllib.parse

          url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          version = os.environ["VERSION"]

          encoded_version = urllib.parse.quote(version, safe="")

          request = urllib.request.Request(
              f"{url}/rest/v1/release_notifications?version=eq.{encoded_version}&select=id",
              headers={
                  "apikey": key,
                  "Authorization": f"Bearer {key}"
              }
          )

          try:
              with urllib.request.urlopen(request) as response:
                  data = response.read().decode("utf-8")
          except Exception as e:
              raise Exception(f"Supabase確認に失敗しました: {e}")

          print(f"Supabase response: {data}")

          if data.strip() == "[]":
              print("このバージョンは未送信です。")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("already_sent=false\n")
          else:
              print("このバージョンは送信済みです。")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("already_sent=true\n")

      - name: Send Discord notification
        if: steps.check.outputs.already_sent == 'false'
        shell: python
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MESSAGE: ${{ steps.release.outputs.message }}
        run: |
          import os
          import json
          import urllib.request

          url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          message = os.environ["MESSAGE"]

          data = json.dumps({
              "action": "send",
              "message": message
          }).encode("utf-8")

          request = urllib.request.Request(
              f"{url}/functions/v1/discord-send",
              data=data,
              method="POST",
              headers={
                  "apikey": key,
                  "Authorization": f"Bearer {key}",
                  "Content-Type": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(request) as response:
                  result = response.read().decode("utf-8")
                  print("Discord送信成功")
                  print(result)
          except Exception as e:
              raise Exception(f"Discord送信に失敗しました: {e}")

      - name: Record release notification
        if: steps.check.outputs.already_sent == 'false'
        shell: python
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          import os
          import json
          import urllib.request

          url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          version = os.environ["VERSION"]

          data = json.dumps({
              "version": version
          }).encode("utf-8")

          request = urllib.request.Request(
              f"{url}/rest/v1/release_notifications",
              data=data,
              method="POST",
              headers={
                  "apikey": key,
                  "Authorization": f"Bearer {key}",
                  "Content-Type": "application/json",
                  "Prefer": "return=minimal"
              }
          )

          try:
              with urllib.request.urlopen(request) as response:
                  print(f"Supabase記録成功: HTTP {response.status}")
          except Exception as e:
              raise Exception(f"Supabaseへの送信済み記録に失敗しました: {e}")

      - name: Skip already sent release
        if: steps.check.outputs.already_sent == 'true'
        run: |
          echo "このバージョンはすでに通知済みなので、Discord送信を行いません。"
